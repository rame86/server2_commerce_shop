#shop-service/ ci-cd.yml
name: Shop Service CI/CD

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. JAR 파일 빌드 (테스트 생략으로 속도 최적화)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      # 2. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/msa-shop
          docker build -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:latest

      # 4. GitHub Actions 러너의 공용 IP 가져오기
      - name: Get Runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      # 5. GCP 인증
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 6. gcloud SDK 설정
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 7. SSH 포트 일시 허용 (방화벽 규칙 이름 충돌 방지를 위해 shop 명시)
      - name: Open Firewall for Deployment
        run: |
          gcloud compute firewall-rules create allow-ssh-shop-${{ github.run_id }} \
            --direction=INGRESS \
            --priority=100 \
            --action=ALLOW \
            --rules=tcp:22 \
            --source-ranges=${{ steps.ip.outputs.ipv4 }}/32 \
            --description="Temporary SSH access for Shop CI/CD"

      # 8. GCP Server 2 배포
      - name: Deploy to GCP Server 2
        uses: appleboy/ssh-action@master
        with:
          host: 34.50.60.193
          username: oksm1003
          key: ${{ secrets.GCP_KEY }}
          script: |
            WORK_DIR="/home/oksm1003/shop"
            mkdir -p $WORK_DIR
            mkdir -p /home/oksm1003/images/shop
            cd $WORK_DIR

            # (중략) Git Pull 로직

            # [.env 파일 동적 생성] - 이름을 properties 파일과 일치시키세요!
            echo "SPRING_PROFILES_ACTIVE=prod" > .env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
            
            # DB 설정 (DB_USER -> POSTGRES_USER로 변경)
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            
            # RabbitMQ 및 기타 인프라 설정 (누락된 GCP_SERVER_1 추가)
            echo "GCP_SERVER_1=${{ secrets.GCP_SERVER_1 }}" >> .env
            echo "RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}" >> .env
            echo "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}" >> .env
            echo "RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}" >> .env
            
            echo "TZ=Asia/Seoul" >> .env
            
            # 컨테이너 실행
            docker compose pull
            docker compose up -d --force-recreate
            
      # 9. 방화벽 규칙 삭제
      - name: Close Firewall
        if: always()
        run: |
          gcloud compute firewall-rules delete allow-ssh-shop-${{ github.run_id }} --quiet